<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Калькулятор прибыли · BROLLER BRO</title>
  <meta name="description" content="Калькулятор прибыли на бройлерах: расходы на цыплят, корм и ветеринарию, выручка, прибыль и себестоимость 1 кг мяса в сумах.">
  <link rel="canonical" href="https://brollerbro.uz/calculator.html">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BROLLER BRO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f6b3a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BROLLER BRO">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Калькулятор прибыли · BROLLER BRO">
  <meta property="og:description" content="Калькулятор прибыли на бройлерах: расходы на цыплят, корм и ветеринарию, выручка, прибыль и себестоимость 1 кг мяса в сумах.">
  <meta property="og:url" content="https://brollerbro.uz/calculator.html">
  <meta property="og:image" content="https://brollerbro.uz/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="calc.title" data-meta="meta.calc">
  <header id="site-header" class="site-header"></header>

  <main class="wrap">
    <h1 data-i18n="calc.title"></h1>
    <p class="lead" data-i18n="calc.lead"></p>

    <div class="calc-grid">
      <form id="calc-form" class="panel">
        <h2 data-i18n="calc.inputs"></h2>

        <fieldset>
          <legend data-i18n="calc.group.birds"></legend>
          <label class="field"><span data-i18n="common.breed"></span><select id="breed"></select></label>
          <label class="field"><span data-i18n="calc.chicks"></span><input id="chicks" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="field"><span data-i18n="calc.chickPrice"></span><input id="chickPrice" type="number" min="0" step="100" inputmode="numeric"></label>
          <label class="field"><span data-i18n="calc.mortality"></span><input id="mortality" type="number" min="0" max="100" step="0.5" inputmode="decimal"></label>
          <label class="field"><span data-i18n="calc.days"></span><input id="days" type="number" min="1" max="45" step="1" inputmode="numeric"></label>
          <label class="field">
            <span data-i18n="calc.perf"></span>
            <input id="perf" type="number" min="0" max="120" step="1" inputmode="numeric">
            <small class="muted" data-i18n="calc.perf.hint"></small>
          </label>
        </fieldset>

        <fieldset>
          <legend data-i18n="calc.group.feed"></legend>
          <label class="field"><span data-i18n="calc.feedPrice"></span><input id="feedPrice" type="number" min="0" step="100" inputmode="numeric"></label>
          <label class="field"><span data-i18n="calc.feedReserve"></span><input id="feedReserve" type="number" min="0" max="50" step="1" inputmode="numeric"></label>
        </fieldset>

        <fieldset>
          <legend data-i18n="calc.group.costs"></legend>
          <label class="field"><span data-i18n="calc.vet"></span><input id="vet" type="number" min="0" step="100" inputmode="numeric"></label>
          <label class="field"><span data-i18n="calc.other"></span><input id="other" type="number" min="0" step="1000" inputmode="numeric"></label>
          <label class="field"><span data-i18n="calc.salePrice"></span><input id="salePrice" type="number" min="0" step="500" inputmode="numeric"></label>
        </fieldset>

        <button id="calc-reset" type="button" class="btn-secondary" data-i18n="calc.reset"></button>
      </form>

      <section class="panel result-panel" id="calc-result" aria-live="polite">
        <h2 data-i18n="calc.result"></h2>
        <div id="calc-output"></div>
        <p class="muted small" data-i18n="calc.note"></p>
      </section>
    </div>

    <!-- Полоска с прибылью внизу экрана телефона; нажатие ведёт к подробному результату -->
    <a href="#calc-result" class="profit-bar" id="profit-bar"></a>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="lang/ru.js"></script>
  <script src="lang/uz.js"></script>
  <script src="lang/uz-latn.js"></script>
  <script src="data/breeds.js"></script>
  <script src="data/phases.js"></script>
  <script src="data/defaults.js"></script>
  <script src="data/site.js"></script>
  <script src="js/main.js"></script>
  <script src="js/calculator.js"></script>
</body>
</html>
