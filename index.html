<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BROLLER BRO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <section class="hero-band">
    <div class="wrap hero-grid">
      <div class="hero-text">
        <p class="eyebrow" data-i18n="site.tagline"></p>
        <h1 class="hero-title brand-name"></h1>
        <p class="lead" data-i18n="home.lead"></p>
      </div>

      <section class="panel batch-panel" aria-labelledby="batch-title">
        <h2 id="batch-title" data-i18n="batch.title"></h2>
        <p class="muted small" data-i18n="batch.text"></p>
        <form id="batch-form" class="batch-form">
          <label class="field">
            <span data-i18n="batch.start"></span>
            <input id="batch-start" type="date" required>
          </label>
          <label class="field">
            <span data-i18n="batch.birds"></span>
            <input id="batch-birds" type="number" min="1" step="1" inputmode="numeric">
          </label>
          <label class="field">
            <span data-i18n="common.breed"></span>
            <select id="breed"></select>
          </label>
          <div class="batch-actions">
            <button type="submit" class="btn-primary" data-i18n="batch.save"></button>
            <button type="button" id="batch-clear" class="btn-link" data-i18n="batch.clear" hidden></button>
          </div>
        </form>
        <div id="batch-today" class="batch-today" hidden></div>
      </section>
    </div>
  </section>

  <main class="wrap">
    <h2 data-i18n="home.tools"></h2>
    <section class="cards">
      <a class="card" href="feeding.html">
        <svg class="card-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 20h28l-3 20a4 4 0 0 1-4 3H17a4 4 0 0 1-4-3z" fill="#f5c542"/>
          <path d="M14 20c0-6 4-11 10-11s10 5 10 11" fill="none" stroke="#2f6b3a" stroke-width="3"/>
          <circle cx="20" cy="30" r="2" fill="#2f6b3a"/><circle cx="27" cy="33" r="2" fill="#2f6b3a"/><circle cx="24" cy="26" r="2" fill="#2f6b3a"/>
        </svg>
        <h3 data-i18n="home.card.feeding.title"></h3>
        <p data-i18n="home.card.feeding.text"></p>
        <span class="card-link" data-i18n="home.card.open"></span>
      </a>
      <a class="card" href="growth.html">
        <svg class="card-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 40h36" stroke="#2f6b3a" stroke-width="3" stroke-linecap="round"/>
          <path d="M8 36c8-2 12-6 16-14s10-12 16-13" fill="none" stroke="#e07a1f" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="40" cy="9" r="4" fill="#f5c542"/>
        </svg>
        <h3 data-i18n="home.card.growth.title"></h3>
        <p data-i18n="home.card.growth.text"></p>
        <span class="card-link" data-i18n="home.card.open"></span>
      </a>
      <a class="card" href="calculator.html">
        <svg class="card-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="10" y="5" width="28" height="38" rx="5" fill="#2f6b3a"/>
          <rect x="15" y="10" width="18" height="8" rx="2" fill="#e5f3e6"/>
          <g fill="#f5c542"><circle cx="18" cy="25" r="2.5"/><circle cx="24" cy="25" r="2.5"/><circle cx="30" cy="25" r="2.5"/><circle cx="18" cy="32" r="2.5"/><circle cx="24" cy="32" r="2.5"/><circle cx="30" cy="32" r="2.5"/><circle cx="18" cy="38" r="2.5"/><circle cx="24" cy="38" r="2.5"/><circle cx="30" cy="38" r="2.5"/></g>
        </svg>
        <h3 data-i18n="home.card.calculator.title"></h3>
        <p data-i18n="home.card.calculator.text"></p>
        <span class="card-link" data-i18n="home.card.open"></span>
      </a>
      <a class="card" href="area.html">
        <svg class="card-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M5 22 24 8l19 14" fill="none" stroke="#2f6b3a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
          <rect x="10" y="21" width="28" height="20" rx="2" fill="#f5c542"/>
          <rect x="20" y="29" width="8" height="12" fill="#2f6b3a"/>
        </svg>
        <h3 data-i18n="home.card.area.title"></h3>
        <p data-i18n="home.card.area.text"></p>
        <span class="card-link" data-i18n="home.card.open"></span>
      </a>
      <a class="card" href="diary.html">
        <svg class="card-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="9" y="5" width="30" height="38" rx="4" fill="#2f6b3a"/>
          <rect x="14" y="5" width="3" height="38" fill="#1f4a28"/>
          <g stroke="#f5c542" stroke-width="3" stroke-linecap="round"><path d="M21 15h12"/><path d="M21 22h12"/><path d="M21 29h8"/></g>
        </svg>
        <h3 data-i18n="home.card.diary.title"></h3>
        <p data-i18n="home.card.diary.text"></p>
        <span class="card-link" data-i18n="home.card.open"></span>
      </a>
    </section>

    <section class="panel">
      <h2 data-i18n="home.tips.title"></h2>
      <ul class="tips">
        <li data-i18n-html="tips.1"></li>
        <li data-i18n-html="tips.2"></li>
        <li data-i18n-html="tips.3"></li>
        <li data-i18n-html="tips.4"></li>
        <li data-i18n-html="tips.5"></li>
        <li data-i18n-html="tips.6"></li>
        <li data-i18n-html="tips.7"></li>
      </ul>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="lang/ru.js"></script>
  <script src="lang/uz.js"></script>
  <script src="data/breeds.js"></script>
  <script src="data/phases.js"></script>
  <script src="data/site.js"></script>
  <script src="js/main.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
