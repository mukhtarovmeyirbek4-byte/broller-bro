<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вес бройлера по дням · BROLLER BRO</title>
  <meta name="description" content="Вес бройлера по дням: таблица и график норм Ross 308 и Cobb 500 с 1 по 45 день. Взвесьте птицу и сравните с нормой.">
  <link rel="canonical" href="https://brollerbro.uz/growth.html">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BROLLER BRO">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f6b3a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BROLLER BRO">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Вес бройлера по дням · BROLLER BRO">
  <meta property="og:description" content="Вес бройлера по дням: таблица и график норм Ross 308 и Cobb 500 с 1 по 45 день. Взвесьте птицу и сравните с нормой.">
  <meta property="og:url" content="https://brollerbro.uz/growth.html">
  <meta property="og:image" content="https://brollerbro.uz/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="growth.title" data-meta="meta.growth">
  <header id="site-header" class="site-header"></header>

  <main class="wrap">
    <h1 data-i18n="growth.title"></h1>
    <p class="lead" data-i18n="growth.lead"></p>

    <div class="controls">
      <label class="field">
        <span data-i18n="common.breed"></span>
        <select id="breed"></select>
      </label>
    </div>

    <div class="growth-grid">
      <section class="panel">
        <h2 data-i18n="growth.chart.title"></h2>
        <div class="chart-box">
          <canvas id="growth-chart"></canvas>
          <p id="chart-nolib" class="muted" data-i18n="growth.chart.noLib" hidden></p>
        </div>
      </section>

      <section class="panel" id="check">
        <h2 data-i18n="growth.check.title"></h2>
        <p class="muted" data-i18n="growth.check.text"></p>
        <div class="controls">
          <label class="field">
            <span data-i18n="growth.check.day"></span>
            <input id="check-day" type="number" min="0" max="45" step="1" value="21" inputmode="numeric">
          </label>
          <label class="field">
            <span data-i18n="growth.check.weight"></span>
            <input id="check-weight" type="number" min="0" step="1" placeholder="900" inputmode="numeric">
          </label>
        </div>
        <div id="check-result" class="check-result" hidden></div>
      </section>
    </div>

    <h2 data-i18n="growth.table.title"></h2>
    <p class="muted" data-i18n="growth.fcr.hint"></p>
    <div class="table-wrap">
      <table id="growth-table" class="data-table">
        <thead>
          <tr>
            <th data-i18n="growth.th.day"></th>
            <th data-i18n="growth.th.weight"></th>
            <th data-i18n="growth.th.gain"></th>
            <th data-i18n="growth.th.cumFeed"></th>
            <th data-i18n="growth.th.fcr"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="lang/ru.js"></script>
  <script src="lang/uz.js"></script>
  <script src="lang/uz-latn.js"></script>
  <script src="data/breeds.js"></script>
  <script src="data/phases.js"></script>
  <script src="data/site.js"></script>
  <script src="js/main.js"></script>
  <script src="js/growth.js"></script>
</body>
</html>
